name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - develop
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.0.0'
          cache: 'npm'
          cache-dependency-path: packages/feastflow-app/package-lock.json
      - name: Install Angular CLI
        run: npm install -g @angular/cli
      - name: Install and build frontend
        working-directory: packages/feastflow-app
        run: |
          npm ci
          npx ng build --configuration production
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FEASTFLOW_APP }}
          channelId: live
          projectId: feastflow-app
          entryPoint: packages/feastflow-app
