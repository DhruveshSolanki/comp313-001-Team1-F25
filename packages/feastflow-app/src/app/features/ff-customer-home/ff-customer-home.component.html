<div>
    <ff-header userName="Customer"></ff-header>
</div>
<div class="ff-customer-home">
    <div class="ff-customer-home-header">
        <div class="ff-customer-home-header-left">
            <i class="bi bi-list cursor-pointer mt-1" (click)="onSidebarToggle()"></i>
            <h5 class="mb-0"> {{homeTitle}}</h5>
        </div>
        <div class="ff-customer-home-header-right mt-1">
            <!-- Reusable search control (no button, live filtering) -->
            <div class="ff-search" *ngIf="homeTitle === 'Explore Menu'">
                <div class="ff-search-input-wrapper">
                    <i class="bi bi-search"></i>
                    <input class="ff-search-input" type="text" placeholder="Search" (input)="searchQuery = $any($event.target).value" />
                </div>
            </div>

            <div class="ff-filter mt-2" *ngIf="homeTitle === 'Explore Menu'">
                <i class="bi bi-sliders2-vertical cursor-pointer" (click)="openAdvancedFilters(advancedFiltersTpl)"></i>
            </div>
        </div>
    </div>
    <div class="ff-customer-home-sidebar">
        <ff-sidebar userRole="customer" (homeTitle)="onHomeTitleChange($event)"></ff-sidebar>
    </div>
    <div class="ff-customer-home-content">
        <div class="ff-customer-home-table" *ngIf="homeTitle === 'Explore Menu'">
            <ng-container *ngFor="let category of filteredCategories | keyvalue: noSort">
                <ff-table
                    userRole="customer"
                    [title]="category.key"
                    [columns]="columns"
                    [data]="(category.value | ffSearch: searchQuery)"
                    (onCartDataChange)="onCartDataChange($event)"
                    [cartData]="cartItems">
                </ff-table>
            </ng-container>
        </div>
        <div class="ff-customer-view-cart" *ngIf="homeTitle === 'View Cart'">
            <ff-view-cart></ff-view-cart>
        </div>
    </div>
    <div class="ff-customer-home-floating" *ngIf="homeTitle === 'Explore Menu'">
        <ff-floating-btn userRole="customer"></ff-floating-btn>
    </div>
</div>

<!-- Advanced Filters Dialog Template -->
<ng-template #advancedFiltersTpl let-data>
    <div class="ff-dialog-field">
        <select class="ff-select" (change)="filters.category = $any($event.target).value">
            <option value="" disabled selected>Dish Category</option>
            <option *ngFor="let c of getKeys(categories)" [value]="c">{{c}}</option>
        </select>
    </div>
    <div class="ff-dialog-field">
        <input class="ff-input" placeholder="Ingredients" (input)="filters.ingredients = $any($event.target).value"/>
    </div>
    <div class="ff-dialog-field">
        <input class="ff-input" placeholder="Restrictions" (input)="filters.restrictions = $any($event.target).value" />
    </div>
    <div class="ff-dialog-field">
        <input class="ff-input" placeholder="Allergen" (input)="filters.allergen = $any($event.target).value" />
    </div>
    <div class="ff-dialog-actions">
        <button class="ff-btn ff-btn-secondary" type="button" (click)="onFiltersClear()">Clear</button>
        <button class="ff-btn ff-btn-primary" type="button" (click)="onFiltersSave()">Save</button>
    </div>
</ng-template>
