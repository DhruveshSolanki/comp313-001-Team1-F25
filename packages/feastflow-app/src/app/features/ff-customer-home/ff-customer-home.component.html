<div>
    <ff-header userName="Customer"></ff-header>
</div>
<div class="ff-customer-home">
    <div class="ff-customer-home-header">
        <div class="ff-customer-home-header-left">
            <i class="bi bi-list cursor-pointer mt-1" (click)="onSidebarToggle()"></i>
            <h5 class="mb-0"> {{homeTitle}}</h5>
        </div>
        <div class="ff-customer-home-header-right mt-1">
            <div class="ff-filter" *ngIf="homeTitle === 'Explore Menu'">
                <i class="bi bi-sliders2-vertical cursor-pointer"></i>
            </div>
        </div>
    </div>
    <div class="ff-customer-home-sidebar">
        <ff-sidebar userRole="customer" (homeTitle)="onHomeTitleChange($event)"></ff-sidebar>
    </div>
    <div class="ff-customer-home-content">
        <div class="ff-customer-home-table" *ngIf="homeTitle === 'Explore Menu'">
            <ng-container *ngFor="let category of categories | keyvalue: noSort">
            <ff-table userRole="customer" [title]="category.key" [columns]="columns" [data]="category.value" (onCartDataChange)="onCartDataChange($event)" [cartData]="cartItems"></ff-table>
            </ng-container>
        </div>
        <div class="ff-customer-view-cart" *ngIf="homeTitle === 'View Cart'">
            <ff-view-cart></ff-view-cart>
        </div>
    </div>
    <div class="ff-customer-home-floating" *ngIf="homeTitle === 'Explore Menu'">
        <ff-floating-btn userRole="customer"></ff-floating-btn>
    </div>
</div>
