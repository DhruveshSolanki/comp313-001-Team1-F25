<div>
    <ff-header userName="Restaurant Staff"></ff-header>
</div>
<div class="ff-restaurant-staff">
    <div class="ff-restaurant-staff-header">
        <div class="ff-restaurant-staff-header-left">
            <i class="bi bi-list cursor-pointer mt-1" (click)="onSidebarToggle()"></i>
            <h5 class="mb-0"> {{homeTitle}}</h5>
        </div>
        <div class="ff-restaurant-staff-header-right mt-1">
            <div class="ff-filter" *ngIf="homeTitle === 'Orders'">
                <i class="bi bi-sliders2-vertical cursor-pointer"></i>
            </div>
        </div>
    </div>
    <div class="ff-restaurant-staff-sidebar">
        <ff-sidebar userRole="restaurantStaff" (homeTitle)="onHomeTitleChange($event)"></ff-sidebar>
    </div>
    <div class="ff-restaurant-staff-content">
        <div class="ff-restaurant-staff-table" *ngIf="homeTitle === 'Orders'">
            <ng-container *ngFor="let category of categories | keyvalue: noSort">
            <ff-table userRole="restaurantStaff" [title]="category.key" [columns]="columns" [data]="category.value" (onDeleteItem)="onDelete($event)"></ff-table>
            </ng-container>
        </div>
        <div class="ff-restaurant-staff-order-status" *ngIf="homeTitle === 'Order Status'"> 
            <ff-order-status></ff-order-status>
        </div>
    </div>
</div>
